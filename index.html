<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<title>66将棋 Web GUI</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<h1>66将棋 Web GUI</h1>

	<!-- 盤面 -->
	<div id="board-container">

		<div id="board-with-ranks">
			<div id="rank-labels">
				<span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span>
			</div>

			<div id="board"></div>
		</div>

		<div id="file-labels">
                        <span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span>
                </div>
	</div>

	<!-- 持ち駒 -->
	<div id="hands">
		<div id="sente-hand" class="hand-area">
			<h3>先手の持ち駒</h3>
			<div id="sente-pieces" class="pieces"></div>
		</div>
		
		<div id="gote-hand" class="hand-area">
			<h3>後手の持ち駒</h3>
			<div id="gote-pieces" class="pieces"></div>
		</div>
	</div>

	<!-- 操作ボタン-->
	<div id="controls">
		<button id="reset">初期化</button>
		<button id="ai-move">AIに指させる</button>
	</div>

	<script src="main.js"></script>
</body>
</html>
