<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<title>66将棋 Web GUI</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<h1>66将棋 Web GUI</h1>

	<!-- 持ち駒 -->
	<div id="game-area">
		
		<div id="gote-hand" class="hand-area">
			<h3>後手の持ち駒</h3>
			<div id="gote-pieces" class="pieces"></div>
		</div>

		
		<!-- 盤面 -->
		<div id="board-container">

			<div id="file-labels">
							<span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
			</div>
			<div id="board-with-ranks">
				

				<div id="board"></div>
				<div id="rank-labels">
					<span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
				</div>
			</div>
		</div>

		<div id="sente-hand" class="hand-area">
			<h3>先手の持ち駒</h3>
			<div id="sente-pieces" class="pieces"></div>
		</div>
		
	</div>

	<!-- 操作ボタン-->
	<div id="controls">
		<button id="reset">初期化</button>
		<button id="ai-move">AIに指させる</button>
		<button id="ai-auto">AI対戦：オフ</button> <!-- 追加 -->
		<button id="resign">投了</button>
	</div>

	<script src="main.js"></script>
	<script src="placement.js"></script>
	<script src="engine.js"></script>
	<script src="ai.js"></script>
</body>
</html>
